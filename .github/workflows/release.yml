name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Detect signing capability
        id: cfg
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_B64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_KEY_B64 }}
        run: |
          [ -n "$CERT" ] && echo "sign=true" >> "$GITHUB_OUTPUT" || echo "sign=false" >> "$GITHUB_OUTPUT"
          [ -n "$NOTARY" ] && echo "notarize=true" >> "$GITHUB_OUTPUT" || echo "notarize=false" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.cfg.outputs.sign == 'true'
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Build (Release)
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "$IDENTITY" ]; then
            # Identity looks like: "Developer ID Application: Name (TEAMID)" — extract TEAMID
            TEAM=$(echo "$IDENTITY" | sed -nE 's/.*\(([^)]+)\)$/\1/p')
            echo "Signing with team: $TEAM"
            xcodebuild -project SpeedS.xcodeproj -scheme SpeedS -configuration Release \
              CODE_SIGN_IDENTITY="$IDENTITY" CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM" \
              ENABLE_HARDENED_RUNTIME=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp" \
              SYMROOT="$PWD/build" build
            # Belt-and-suspenders: re-sign with hardened runtime + timestamp,
            # in case xcodebuild's pass missed something.
            codesign --force --deep --options runtime --timestamp \
              --sign "$IDENTITY" build/Release/SpeedS.saver
            codesign --verify --deep --strict --verbose=2 build/Release/SpeedS.saver
          else
            xcodebuild -project SpeedS.xcodeproj -scheme SpeedS -configuration Release \
              SYMROOT="$PWD/build" build
          fi

      - name: Notarize and staple
        if: steps.cfg.outputs.notarize == 'true'
        env:
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "$KEY_BASE64" | base64 --decode > /tmp/key.p8
          ditto -c -k --keepParent build/Release/SpeedS.saver /tmp/notarize.zip

          submit_out=$(xcrun notarytool submit /tmp/notarize.zip \
            --key /tmp/key.p8 --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json)
          echo "$submit_out"
          sid=$(echo "$submit_out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          status=$(echo "$submit_out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')

          if [ "$status" != "Accepted" ]; then
            echo "::group::Apple notary log for $sid"
            xcrun notarytool log "$sid" --key /tmp/key.p8 --key-id "$KEY_ID" --issuer "$ISSUER" || true
            echo "::endgroup::"
            rm -f /tmp/key.p8 /tmp/notarize.zip
            echo "::error::Notarization status: $status"
            exit 1
          fi

          xcrun stapler staple build/Release/SpeedS.saver
          rm /tmp/key.p8 /tmp/notarize.zip

      - name: Zip artifact
        run: |
          mkdir -p dist
          cd build/Release
          ditto -c -k --keepParent SpeedS.saver "$GITHUB_WORKSPACE/dist/SpeedS-${{ steps.ver.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedS-${{ steps.ver.outputs.version }}
          path: dist/*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
